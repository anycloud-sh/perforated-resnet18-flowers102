name: Build candidate image

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'validation/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/anycloud-sh/perforated-resnet18-flowers102:candidate-${{ github.sha }}
          provenance: false
      - name: Test checkpoint recovery in candidate
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            ghcr.io/anycloud-sh/perforated-resnet18-flowers102:candidate-${{ github.sha }} \
            python -m unittest discover -s /app/tests -v
      - name: Publish tested candidate
        run: docker push ghcr.io/anycloud-sh/perforated-resnet18-flowers102:candidate-${{ github.sha }}
