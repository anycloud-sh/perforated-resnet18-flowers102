name: Promote validated digest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Validated candidate digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed Lambda and AWS Spot validation
        env:
          DIGEST: ${{ inputs.digest }}
        run: python3 validation/check_spot_promotion.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Retag the existing manifest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          image=ghcr.io/anycloud-sh/perforated-resnet18-flowers102
          "$(go env GOPATH)/bin/crane" tag "$image@$DIGEST" v0.2.0
          actual="$("$(go env GOPATH)/bin/crane" digest "$image:v0.2.0")"
          test "$actual" = "$DIGEST"
